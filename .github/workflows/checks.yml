# v4.20: runs the project's three checks on every push and pull request. Duke signed off on
# jsdom as a dev-only dependency (open since v4.12). Nothing here builds or changes index.html;
# the simulation still runs by opening that one file. See CONTRIBUTING.md, Code Contributions.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install jsdom (the only dev dependency; see package.json)
        run: npm install --no-audit --no-fund
      - name: Engine regression (seed 42; and the legacy switch against v4.19)
        run: node harness.js validate
      - name: Pure-function tests (harness.js)
        run: node harness.js unit
      - name: Page behaviour, and the unit suite and source parity against the page (jsdom)
        run: node domtest.js
      - name: One glossary on the front page and the findings page (site/glossary.json)
        run: python3 dev/tools/glossary.py --check

  # Session 2a (Oct 13, 2026): the guard test. 20 fixed seeds of the v5.4 panel's main rows in the three environments, compared output by output
  # with the reference in dev/runs/guard (made before any engine edit). A switched-off mechanism must leave it identical. Runs beside the checks above.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guard test (every figure of 25 v5.4 panel rows, seeds 1-20, Reference, Adverse and Stress)
        run: node dev/tools/guard_test.js
