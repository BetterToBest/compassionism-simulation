# Oct 14, 2026 (ledger issue i20): pinned to ubuntu-24.04, Node 22.22.0 (the version the 500-seed panels record) and Python 3.13, so a
# runner-image change (ubuntu-latest moves to Ubuntu 26 on Oct 19) cannot change outputs or timings with no code change.
# v4.20: runs the project's three checks on every push and pull request. Duke signed off on
# jsdom as a dev-only dependency (open since v4.12). Nothing here builds or changes index.html;
# the simulation still runs by opening that one file. See CONTRIBUTING.md, Code Contributions.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install jsdom (the only dev dependency; see package.json)
        run: npm install --no-audit --no-fund
      - name: Engine regression (seed 42; and the legacy switch against v4.19)
        run: node harness.js validate
      - name: Pure-function tests (harness.js)
        run: node harness.js unit
      - name: Page behaviour, and the unit suite and source parity against the page (jsdom)
        run: node domtest.js
      - name: One glossary on the front page and the findings page (site/glossary.json)
        run: python3 dev/tools/glossary.py --check
      # S84 (Nov 17, 2026): one start for every study runner; the documents, the manifest and the engine agree; weights.
      - name: The one start (harness.js startRelease), and the baseline check against the release's published rows
        run: node dev/tools/start_test.js
      - name: The specification, the test bed, the other documents and the manifest's docs field agree with the engine
        run: node dev/tools/check_docs_agree.js
      - name: Weight tests (weights sum to the adults; weighted means and quantiles; zero and extreme weights; effective sample size; largest weight)
        run: node dev/tools/weight_tests.js
      # Results are deposited outside git (Zenodo); every results folder a page or report names must be in the manifest or listed as not deposited.
      - name: Every cited results folder is in data/results-manifest.json (deposited or listed as not deposited)
        run: python3 dev/tools/deposit.py check

  # Session 2a (Oct 13, 2026): the guard test. 20 fixed seeds of the v5.4 panel's main rows in the three environments, compared output by output
  # with the reference in dev/runs/guard (made before any engine edit). A switched-off mechanism must leave it identical. Runs beside the checks above.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
      - name: Guard test (every figure of 25 v5.4 panel rows, seeds 1-20, Reference, Adverse and Stress)
        run: node dev/tools/guard_test.js
