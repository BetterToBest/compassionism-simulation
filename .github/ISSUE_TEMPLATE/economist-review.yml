name: Economist review
description: A review of the model by an economist, one row at a time (the same rows as ECONOMIST-REVIEW.md)
title: "Economist review: "
body:
  - type: markdown
    attributes:
      value: "One page for an independent economist, rebuilt for v5.9 on Nov 17, 2026 (engine `104691f`). Each row names one thing to check, where it is in the repository, and what the model does today. Mark each row agree, disagree or cannot tell, with a line of why. You need not do every row. Rows about what the framework means (as opposed to how it is modelled) belong to its author, Duke Johnson; say so in a comment. The model in one page: [model-card.html](https://bettertobest.github.io/compassionism-simulation/model-card.html); in full: [ODD.md](ODD.md) and [MODEL_SPEC.md](MODEL_SPEC.md)."
  - type: input
    id: who
    attributes:
      label: Your name and field (optional)
    validations:
      required: false
  - type: textarea
    id: backing
    attributes:
      label: "1. **Full backing.** The main row assumes every dollar the programme pays is matched by new output"
      description: "Where: TESTBED_SPEC.md section 0; MODEL_SPEC.md 14.0; `dev/reports/s64-round2-q4-backing.md`. Today: This is the design's statement, a design parameter, not a model result: the model's own mechanism for new output reaches 0.2 to 1.9% of the payout. Inflation stays under 5% a year only above about 86 to 90% backing; at the mechanism's own point it runs at 15 to 53 points a year. The backing curve (0, 0.25, 0.5, 0.75, 1) is published beside the main row. Is leading with full backing, with the curve beside it, a fair presentation? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: supply_limit
    attributes:
      label: "2. **No limit on supply below full backing.** Demand never runs into what the economy can produce"
      description: "Where: `dev/reports/s64-round2-q4-backing.md`, item 4 and its note of Nov 17, 2026; MODEL_SPEC 6.12, 14.3. Today: The poverty effects barely depend on backing because, with no new output, the real goods recipients gain are paid for only by higher prices on everyone, and wages, the BU and the basket all follow those prices. A rationing reading is planned for the next engine version. Which limit on real supply would you add first, and how would you size it? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: wage_index
    attributes:
      label: "3. **Wages follow prices in full** (`wIdx` 1)"
      description: "Where: MODEL_SPEC 6.1, 6.12; `dev/reports/s70-screen.md`, item 3. Today: Wages are indexed to the price level each year. At no backing this is the largest mover of programme inflation (μ* 20 to 34 points a year). Partial indexation is planned as a reading. What share is defensible for a programme of this size, and over what lag? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: asset_returns
    attributes:
      label: "4. **Asset returns under high inflation**"
      description: "Where: MODEL_SPEC 14.6, 14.7; `dev/reports/s59-asset-classes.md`, `s71-creditor-side.md`. Today: Real assets keep their real value (plus Shiller's real gains), nominal assets earn 0.46 of inflation, floating debt reprices in full and fixed-rate debt is eroded by inflation (debt relief). At full backing the erosion is under 3% of any wealth gain; at no backing, how far real assets follow inflation is the largest mover of wealth poverty and median wealth. Is that portfolio behaviour plausible at inflation of 15-50% a year, and who should bear the creditors' loss (five readings are run)? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: spend_share
    attributes:
      label: "5. The share of extra cash spent: 0.877 in v5.9, re-derived from the BEA 2025 saving rate on the no-programme run"
      description: "Where: MODEL_SPEC 13.3; `dev/reports/s64-round2-q2-robustness.md`. Today: 0.593 is a reading on every curve and the largest mover of median wealth. A wage-only base (0.862) is planned as a reading. Is the derivation right? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: income_effect
    attributes:
      label: "6. The income effect and the participation margin (one income effect per unconditional dollar, split 0.43 to leaving work)"
      description: "Where: MODEL_SPEC 6.11, 14.15; `dev/reports/s73-participation.md`. Today: Matches the US guaranteed-income experiment's participation effect (−1.3 points, interval −7.5 to −0.9). Participation falls 1 to 5 points. Is the split right? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: wage_elasticity
    attributes:
      label: "7. One wage elasticity for every change in the return to work"
      description: "Where: dev/DECISIONS.md (fairness rule). Today: Every change in the return to work uses the same elasticity. Is that the right treatment? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: tail_weights
    attributes:
      label: "8. The weighted top tail and which measures read the weights"
      description: "Where: ODD.md section 4 (Observation); MODEL_SPEC 14.8; `dev/reports/s59-tail-returns.md`. Today: 18 tail adults with population weights (Pareto exponent 1.490, standard error 0.136, cutoff the 97.5th percentile). Poverty shares count each simulated adult once; median wealth and the distribution measures are weighted; the government's books are weighted sums, the payout and prices are not. Is that split acceptable, and does the tail's fit matter? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: fixed_population
    attributes:
      label: "9. A fixed population in the main row (no births, deaths, ageing, partnerships)"
      description: "Where: MODEL_SPEC section 2 and 14.15. Today: Ageing exists as a reading; the 40-year figures do not age anyone. How much would ageing change the 40-year results? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: financed_rows
    attributes:
      label: "10. Paying by a contribution instead of the Source (the financed rows)"
      description: "Where: `dev/reports/s64-round2-q5-financed.md`; `dev/reports/s72-government-budget.md`. Today: Shown, never led with: the full-coverage design needs 63-77% of all money income; 46 of 48 financed curves are fragile. Is the government account's treatment (borrowing rate, debt premium, weighted books) sound? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: central_bank
    attributes:
      label: "11. The central bank: a Taylor rule with purchases, refinancing, asset prices, job loss and forced sales (a study, 100 seeds)"
      description: "Where: MODEL_SPEC section 15; `dev/reports/s74-central-bank.md`. Today: No channel to the price of essentials, so the design's damping claim cannot show; the rule moves wealth up the distribution through asset prices and forced sales. Are the channels and their slopes reasonable? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: policy_eras
    attributes:
      label: "12. The history readings: today's households under four US policy eras (a study, 100 seeds)"
      description: "Where: MODEL_SPEC section 16; `dev/reports/s75-deep-history.md`. Today: A model counterfactual, not a backtest; no expectations channel. Is anything in it read as more than that? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: participation
    attributes:
      label: "13. Participation and the amount of BU (Basic Units) in the opt-in design are design choices, not facts about the world"
      description: "Where: `dev/reports/s64-round2-q1-main-effects.md`; Stress (40% take-up). Today: The opt-in design loses about two thirds of each effect in Stress. What take-up should be assumed, and on what evidence? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: us_data
    attributes:
      label: "14. The no-programme run against US data (wealth, earnings, labour force, the top 1% share)"
      description: "Where: ODD.md section 1; findings.html. Today: Which gaps with US data would change a conclusion, and which would not? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: both_measures
    attributes:
      label: "15. Every gain is confirmed on basket poverty and on wealth poverty, not on one measure; BLEI is the days of basic living that savings, income and the BU cover (a capacity measure, not cash on hand)"
      description: "Where: findings.html; the BLEI paper. Today: Is the way the measures are reported fair? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: unsourced_constants
    attributes:
      label: "16. Two constants with no source remain in the earlier engine (CCO cost relief; PTF and PTH inflation damping)"
      description: "Where: `dev/runs/unsourced-constants-check.txt`. Today: Neither is used by any v5.9 row. Is a source known for either? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Anything else
    validations:
      required: false
  - type: markdown
    attributes:
      value: "The math and code of this simulation were engineered by Claude, an AI model made by Anthropic, from the concepts in Duke Johnson's book *Better To Best* and his related vision for eradicating extreme poverty while enriching cultures and supporting human flourishing. The model has not yet been reviewed by an independent economist; the full code is open for anyone to check, and expert collaborators are welcome."
