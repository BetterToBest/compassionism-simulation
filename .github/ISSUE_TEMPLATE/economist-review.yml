name: Economist review
description: A review of the model by an economist, one row at a time (the same rows as ECONOMIST-REVIEW.md)
title: "Economist review: "
body:
  - type: markdown
    attributes:
      value: "One page for an independent economist. Each row names one thing to check, where it is in the repository, and what the model does today. Mark each row agree, disagree or cannot tell, with a line of why. You need not do every row. Rows about what the framework means (as opposed to how it is modelled) belong to its author, Duke Johnson; say so in a comment."
  - type: input
    id: who
    attributes:
      label: Your name and field (optional)
    validations:
      required: false
  - type: textarea
    id: unsourced_cco
    attributes:
      label: "1. CCO (Creative Currency Octaves) cost relief has no source (20% of the basket at the reference BU, ceiling 50%)"
      description: "Where: index.html: CCO_RELIEF_AT_REF, CCO_RELIEF_CAP; dev/runs/unsourced-constants-check.txt. Today: Earlier engine only. Raising it left every released row unchanged. Is that right, and is there a source or a range worth sweeping? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: unsourced_damping
    attributes:
      label: "2. Inflation damping by community businesses (PTF, which cut prices) and community housing (PTH) has no source: how much of outside inflation they absorb, applied to the overall inflation rate (0.5 and 0.1 times the share who joined)"
      description: "Where: index.html: grep \"inflRate*=(1-\"; dev/runs/unsourced-constants-check.txt. Today: Off in every main row; on only in one optional row. Is a source known for its size? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: rho
    attributes:
      label: "3. The income effect on earnings (how far people cut paid work when given money; sourced range 0.05 to 0.30)"
      description: "Where: dev/reports/v5-30-s137-results.md, section 8; dev/DECISIONS.md. Today: The one uncertain behavioural constant that matters for basket poverty. Is the range right for a payment of this size and kind? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: wage_elasticity
    attributes:
      label: "4. One wage elasticity for every change in the return to work"
      description: "Where: dev/DECISIONS.md (fairness rule). Today: Every change in the return to work uses the same elasticity. Is that the right treatment? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: spend_share
    attributes:
      label: "5. The share of extra cash spent (from the range of the US saving rate in recent years)"
      description: "Where: dev/reports/v5-30-s137-results.md, section 8. Today: Drives the \"too little wealth\" result more than any other input. Is the range right? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: participation
    attributes:
      label: "6. Participation and the amount of BU (Basic Units) paid are design choices, not facts about the world"
      description: "Where: study.html, \"What the results depend on\". Today: They explain most of the spread in poverty, cost and inflation. What take-up should be assumed, and on what evidence? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: price_rule
    attributes:
      label: "7. The price rule: how programme spending and extra demand raise prices"
      description: "Where: dev/reports/v5-30-s137-results.md, section 6; dev/DECISIONS.md. Today: Not calibrated to outside evidence on benefit-funded demand. The \"too little wealth\" rise comes through it. Which evidence would calibrate it? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: single_payer
    attributes:
      label: "8. Single-payer savings come from one preprint that is not peer reviewed"
      description: "Where: study.html, \"Single payer depends on the Yale preprint\". Today: Central, cautious and high-cost cases are run. Are these the right cases? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: cost_line
    attributes:
      label: "9. The cost-of-living line is the unweighted state average"
      description: "Where: dev/reports/v5-30-s137-results.md, section 9. Today: A population-weighted line is a known later fix. How much would it matter? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: both_measures
    attributes:
      label: "10. Every gain is confirmed on basket poverty (below the cost of living) and on wealth poverty (too little wealth), not on one measure"
      description: "Where: study.html; findings.html. Today: Compassionism lowers basket poverty and raises \"too little wealth\". Is the way both are reported fair? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: us_data
    attributes:
      label: "11. The no-programme run against US data (poverty, debt, savings)"
      description: "Where: findings.html; dev/DECISIONS.md. Today: Which gaps with US data would change a conclusion, and which would not? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: wwtbt
    attributes:
      label: "12. The study page's \"What would have to be true\" panel is Claude's reading of the sensitivity results, not a finding of the study"
      description: "Where: study.html, \"What would have to be true (Claude's reading)\"; dev/tools/study_data.py (table wwtbt). Today: For each headline result it names what would have to be true and what the study found when those inputs were varied. Does any line claim more than the study shows, or miss a condition? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: safety_net
    attributes:
      label: "13. Tax revenue is not reconciled with today's safety-net outlays or government's share of the plan"
      description: "Where: dev/reports/v5-30-s137-results.md, section 9. Today: The model reports these costs; it does not show they are financed. Is that an acceptable limit, stated this way? Say agree, disagree or cannot tell, and why."
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Anything else
    validations:
      required: false
  - type: markdown
    attributes:
      value: "The math and code of this simulation were engineered by Claude, an AI model made by Anthropic, from the concepts in Duke Johnson's book *Better To Best* and his related vision for eradicating extreme poverty while enriching cultures and supporting human flourishing. The model has not yet been reviewed by an independent economist; the full code is open for anyone to check, and expert collaborators are welcome."
