<desc id="d">Reference: inflation 36.5 a year with no backing, 0.06 at full backing; 5% a year at 87% backed; the mechanism reaches 0.4% and 13.6%. Adverse: inflation 48.3 a year with no backing, 0.09 at full backing; 5% a year at 89% backed; the mechanism reaches 0.2% and 13.6%. Stress: inflation 53.3 a year with no backing, 0.09 at full backing; 5% a year at 90% backed; the mechanism reaches 0.2% and 13.7%.</desc>
