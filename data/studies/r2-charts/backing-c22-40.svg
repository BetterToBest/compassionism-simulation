<desc id="d">Reference: inflation 35.1 a year with no backing, 0.07 at full backing; 5% a year at 86% backed; the mechanism reaches 0.4% and 13.5%. Adverse: inflation 45.4 a year with no backing, 0.09 at full backing; 5% a year at 89% backed; the mechanism reaches 0.2% and 13.5%. Stress: inflation 50.3 a year with no backing, 0.09 at full backing; 5% a year at 90% backed; the mechanism reaches 0.2% and 13.7%.</desc>
