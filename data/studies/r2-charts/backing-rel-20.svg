<desc id="d">Reference: inflation 35.3 a year with no backing, 0.12 at full backing; 5% a year at 87% backed; the mechanism reaches 1.1% and 19.6%. Adverse: inflation 40.9 a year with no backing, 0.08 at full backing; 5% a year at 89% backed; the mechanism reaches 0.8% and 19.6%. Stress: inflation 18.2 a year with no backing, 0.02 at full backing; 5% a year at 74% backed; the mechanism reaches 1.9% and 19.5%.</desc>
