<desc id="d">Reference: inflation 33.8 a year with no backing, 0.05 at full backing; 5% a year at 86% backed; the mechanism reaches 0.6% and 13.8%. Adverse: inflation 46.3 a year with no backing, 0.01 at full backing; 5% a year at 90% backed; the mechanism reaches 0.3% and 13.7%. Stress: inflation 20.6 a year with no backing, 0.00 at full backing; 5% a year at 77% backed; the mechanism reaches 0.7% and 13.7%.</desc>
