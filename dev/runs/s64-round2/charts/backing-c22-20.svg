<desc id="d">Reference: inflation 40.3 a year with no backing, 0.15 at full backing; 5% a year at 88% backed; the mechanism reaches 0.8% and 19.5%. Adverse: inflation 46.0 a year with no backing, 0.18 at full backing; 5% a year at 89% backed; the mechanism reaches 0.5% and 19.4%. Stress: inflation 48.7 a year with no backing, 0.18 at full backing; 5% a year at 90% backed; the mechanism reaches 0.5% and 19.3%.</desc>
