<desc id="d">Reference: inflation 36.5 a year with no backing, 0.12 at full backing; 5% a year at 87% backed; the mechanism reaches 1.0% and 19.5%. Adverse: inflation 42.3 a year with no backing, 0.08 at full backing; 5% a year at 89% backed; the mechanism reaches 0.7% and 19.5%. Stress: inflation 19.2 a year with no backing, 0.01 at full backing; 5% a year at 75% backed; the mechanism reaches 1.8% and 19.4%.</desc>
