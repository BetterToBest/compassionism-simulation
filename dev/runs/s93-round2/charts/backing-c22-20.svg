<desc id="d">Reference: inflation 38.8 a year with no backing, 0.16 at full backing; 5% a year at 88% backed; the mechanism reaches 0.8% and 19.5%. Adverse: inflation 43.8 a year with no backing, 0.19 at full backing; 5% a year at 89% backed; the mechanism reaches 0.5% and 19.4%. Stress: inflation 46.4 a year with no backing, 0.19 at full backing; 5% a year at 90% backed; the mechanism reaches 0.5% and 19.3%.</desc>
